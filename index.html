<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hot Wheels</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- =====================================================
         ESCENA 1 — CARGANDO
         ===================================================== -->

    <section id="loadingScene" class="scene loading-scene">

        <div class="loading-background"></div>

        <div class="loading-content">

            <h1>
                Cargando tu ramo de
                <br>
                <span>Hot Wheels...</span>
            </h1>

            <img
                src="assets/auto.png"
                class="loading-car"
                alt="Hot Wheels"
            >

            <div class="loading-track">
                <div
                    id="loadingProgress"
                    class="loading-progress">
                </div>
            </div>

            <div
                id="loadingPercent"
                class="loading-percent">
                0%
            </div>

        </div>

    </section>


    <!-- =====================================================
         ESCENA 2 — ESTRELLAS Y LUNA
         ===================================================== -->

    <section id="skyScene" class="scene sky-scene">

        <img
            src="assets/estrellas.png"
            class="sky-stars"
            alt=""
        >

        <img
            src="assets/luna.png"
            class="sky-moon"
            alt=""
        >

        <div class="sky-text">
            <h1>Hot Wheels</h1>
            <p>Un pequeño detalle para ti...</p>
        </div>

    </section>


    <!-- =====================================================
         ESCENA 3 — RAMO
         ===================================================== -->

    <section id="bouquetScene" class="scene bouquet-scene">

        <img
            src="assets/estrellas.png"
            class="bouquet-stars"
            alt=""
        >

        <img
            src="assets/luna.png"
            class="bouquet-moon"
            alt=""
        >

        <div class="bouquet-title">

            <h2>Un ramo diferente</h2>

            <h1>
                Hot Wheels
            </h1>

        </div>

        <div class="bouquet-image">

            <!-- Aquí puedes colocar posteriormente
                 tu imagen del ramo azul si la agregamos -->

            <img
                src="assets/auto.png"
                alt="Hot Wheels"
            >

        </div>

    </section>


    <!-- =====================================================
         ESCENA 4 — TARJETA 1
         ===================================================== -->

    <section id="card1Scene" class="scene card-scene">

        <div class="card-wrapper">

            <img
                src="assets/tarjeta 1.png"
                class="romantic-card"
                alt="Tarjeta Hot Wheels"
            >

        </div>

    </section>


    <!-- =====================================================
         ESCENA 5 — TARJETA 2
         ===================================================== -->

    <section id="card2Scene" class="scene card-scene">

        <div class="card-wrapper">

            <img
                src="assets/tarjeta 2.png"
                class="romantic-card"
                alt="Tarjeta Hot Wheels"
            >

        </div>

    </section>


    <!-- =====================================================
         ESCENA 6 — TARJETA 3
         ===================================================== -->

    <section id="card3Scene" class="scene card-scene">

        <div class="card-wrapper">

            <img
                src="assets/tarjeta 3.png"
                class="romantic-card"
                alt="Tarjeta Hot Wheels"
            >

        </div>

    </section>


    <!-- =====================================================
         ESCENA 7 — FINAL
         ===================================================== -->

    <section id="finalScene" class="scene final-scene">

        <div class="final-background"></div>

        <div class="final-content">

            <img
                src="assets/corazones.png"
                class="final-hearts"
                alt=""
            >

            <img
                src="assets/auto.png"
                class="final-car"
                alt="Hot Wheels"
            >

            <h1>
                Hot Wheels
            </h1>

            <p>
                Un pequeño detalle
                <br>
                hecho con mucho cariño.
            </p>

        </div>

    </section>

</div>

<script src="script.js"></script>

</body>
</html>
