<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hot Wheels</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- ================================= -->
        <!-- ESCENA 1: CARGANDO -->
        <!-- ================================= -->

        <section id="loadingScene" class="scene loading-scene">

            <div class="loading-content">

                <h1>
                    Cargando tu ramo de
                    <br>
                    <span>Hot Wheels...</span>
                </h1>

                <div class="loading-car">
                    🏎️
                </div>

                <div class="loading-track">
                    <div id="loadingProgress" class="loading-progress"></div>
                </div>

                <div id="loadingPercent" class="loading-percent">
                    0%
                </div>

            </div>

        </section>


        <!-- ================================= -->
        <!-- ESCENA 2: RAMO HOT WHEELS -->
        <!-- ================================= -->

        <section id="bouquetScene" class="scene bouquet-scene">

            <!-- Estrellas -->
            <div class="stars"></div>

            <!-- Luna -->
            <div class="moon"></div>

            <!-- Título -->
            <div class="bouquet-title">

                <h2>
                    Feliz Día de los
                </h2>

                <h1>
                    Carritos de Hot Wheels
                </h1>

            </div>


            <!-- Ramo -->
            <div class="bouquet">

                <div class="stem stem1"></div>
                <div class="stem stem2"></div>
                <div class="stem stem3"></div>
                <div class="stem stem4"></div>
                <div class="stem stem5"></div>

                <div class="flower flower1">
                    <span></span>
                </div>

                <div class="flower flower2">
                    <span></span>
                </div>

                <div class="flower flower3">
                    <span></span>
                </div>

                <div class="flower flower4">
                    <span></span>
                </div>

                <div class="flower flower5">
                    <span></span>
                </div>

            </div>


            <!-- Auto -->
            <div class="road">

                <div id="mainCar" class="main-car">
                    🏎️
                </div>

            </div>

        </section>


        <!-- ================================= -->
        <!-- ESCENA 3: CARTAS -->
        <!-- ================================= -->

        <section id="cardsScene" class="scene cards-scene">

            <div class="card-background">

                <div class="card-glow"></div>

                <div class="hotwheels-card">

                    <div class="card-top">

                        <span class="card-number">
                            01
                        </span>

                        <span class="card-brand">
                            HOT WHEELS
                        </span>

                    </div>


                    <div class="card-car">
                        🏎️
                    </div>


                    <div class="card-message">

                        <p id="cardMessage">
                            Cuanto más tiempo estoy contigo,
                            más te amo.
                        </p>

                    </div>


                    <div class="card-bottom">

                        <span>
                            HOT WHEELS
                        </span>

                        <span>
                            ♥
                        </span>

                    </div>

                </div>

            </div>

        </section>


        <!-- ================================= -->
        <!-- ESCENA FINAL -->
        <!-- ================================= -->

        <section id="finalScene" class="scene final-scene">

            <div class="final-content">

                <div class="final-car">
                    🏎️
                </div>

                <h1>
                    Hot Wheels
                </h1>

                <p>
                    Un pequeño detalle
                    hecho con mucho cariño.
                </p>

                <div class="hearts">
                    ♥ ♥ ♥
                </div>

            </div>

        </section>

    </div>


    <script src="script.js"></script>

</body>
</html>
